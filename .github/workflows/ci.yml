name: CI

on: 
  push:
    branches:
      - main
      - setup-task
  pull_request:
    branches:
      - main

jobs:
  basic-ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Show Python version
        run: python --version
